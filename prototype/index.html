/* Layout: 어두운 영화 같은 한 화면. 넓은 화면은 왼쪽 세로 목차(64px) + 오른쪽 본문, 휴대폰은 위쪽 진행 막대 + 펼침 목차.
   첫 화면은 화면 가득한 SILTARAE 글자 뒤로 실 같은 빛줄기가 흐른다. 빛은 잉걸불(주홍)과 금색만 쓴다. 한 가지 테마로 고정. */
:root{
  color-scheme:dark;
  --bg:#0A0908; --bg-2:#110F0D; --ink:#F3EEE8; --ink-2:rgba(243,238,232,.66); --ink-3:rgba(243,238,232,.40);
  --ember:#FF6A3D; --gold:#F5B04A; --sage:#8FCB9B; --plum:#B78CF2; --rose:#F07FA0; --olive:#C7D16E;
  --glass:rgba(255,255,255,.035); --glass-2:rgba(255,255,255,.06); --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.15);
  --f-display:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Lucian 요소가 읽는 토큰을 이 페이지의 어두운 색에 맞춤 */
  --ux-page:#0A0908; --ux-surface:#16130F; --ux-surface-2:#1E1A16; --ux-surface-3:#2A2520;
  --ux-ink:#F3EEE8; --ux-ink-2:rgba(243,238,232,.66); --ux-ink-3:rgba(243,238,232,.40);
  --ux-line:rgba(255,255,255,.08); --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#FF6A3D; --ux-accent-2:#F5B04A; --ux-accent-soft:rgba(255,106,61,.16); --ux-accent-ink:#0A0908;
  --ux-mint:#8FCB9B; --ux-warn:#F5B04A; --ux-danger:#FF6B6B;
  --ux-glass:rgba(255,255,255,.07); --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45); --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#FF6A3D,#F5B04A 60%,#8FCB9B);
  --ux-ease:cubic-bezier(.2,.8,.2,1); --ux-spring:cubic-bezier(.34,1.45,.64,1);
}

/* ---- Lucian 공통 베이스 (tokens.css의 .ux 규칙, 글꼴만 이 페이지 글꼴로) ---- */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{font-family:var(--f-body);color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.ux,.ux *,.ux *::before,.ux *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ---- 바탕: 먹색 + 필름 입자 + 가장자리 어둡게 ---- */
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.035em;font-weight:900}
p{margin:0}
a{color:var(--gold);text-underline-offset:3px}
::selection{background:var(--ember);color:var(--bg)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13.5px}
.label{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.label b{color:var(--ink);font-weight:500}
mark{background:none;color:var(--gold);font-weight:700}

/* ---- 레이아웃 ---- */
.shell{max-width:1060px;margin:0 auto;padding-left:0}
@media (min-width:1000px){.shell{padding-left:84px}}
main{display:flex;flex-direction:column;gap:28px;padding-top:24px}

/* ---- 세로 목차 (넓은 화면) ---- */
.side{display:none}
@media (min-width:1000px){
  .side{display:flex;position:fixed;left:env(safe-area-inset-left,0px);top:0;bottom:0;width:64px;z-index:40;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0;border-right:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px)}
  .topbar{display:none!important}
}
.mark{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:900 17px/1 var(--f-body)}
.mark:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side button{all:unset;cursor:pointer;position:relative;writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);padding:10px 6px;font:500 11px/1 var(--f-mono);letter-spacing:.12em;color:var(--ink-3);transition:color .25s;white-space:nowrap}
.side button:hover{color:var(--ink)}
.side button:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
.side button[aria-current="step"]{color:var(--ember)}
.side button[aria-current="step"]::after{content:"";position:absolute;right:-12px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--ember)}
.side button.done{color:var(--ink-2)}
.side .mark{writing-mode:horizontal-tb;transform:none;width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px;background:var(--ink);color:var(--bg);font:900 17px/1 var(--f-body);letter-spacing:0}
.side .mark:hover{color:var(--bg)}
.side .nm{display:none;margin-top:8px}
.side button[aria-current="step"] .nm,.side button:hover .nm,.side button:focus-visible .nm{display:inline}
.side .count{font:500 11px/1.4 var(--f-mono);color:var(--ink-3);text-align:center}
.side .count b{display:block;color:var(--ink);font-weight:500;font-size:14px}

/* ---- 위쪽 막대 (휴대폰·태블릿) ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .in{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.topbar .now{flex:1;min-width:0;font:500 12px/1.3 var(--f-mono);letter-spacing:.1em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .now b{color:var(--ink);font-weight:500}
.menu-btn{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair-2);font:500 12px/34px var(--f-mono);letter-spacing:.1em}
.menu-btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.progress{height:2px;background:var(--hair);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));transition:width .8s var(--ux-spring)}
.sheet-menu{position:fixed;inset:auto 0 0 0;z-index:60;max-height:80svh;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));background:#14110E;border-radius:24px 24px 0 0;box-shadow:0 -30px 60px rgba(0,0,0,.6);transform:translateY(105%);visibility:hidden;transition:transform .5s var(--ux-spring),visibility 0s .5s}
.sheet-menu.open{transform:none;visibility:visible;transition:transform .5s var(--ux-spring)}
@media (min-width:1000px){.sheet-menu,.scrim{display:none}}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet-menu ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.sheet-menu button{all:unset;cursor:pointer;display:flex;gap:14px;align-items:baseline;width:100%;padding:12px 4px;border-bottom:1px solid var(--hair);font-size:16px;font-weight:700}
.sheet-menu button span{font:500 12px/1 var(--f-mono);color:var(--ink-3);width:26px}
.sheet-menu button[aria-current="step"]{color:var(--ember)}
.sheet-menu button:focus-visible{outline:2px solid var(--ember)}

/* ---- 미션 머리: 큰 번호 ---- */
.head{position:relative;display:flex;flex-direction:column;gap:12px;padding:28px 0 6px}
.head .num{position:absolute;right:-6px;top:-4px;font:900 clamp(120px,22vw,240px)/.8 var(--f-display);font-stretch:125%;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px var(--hair-2);pointer-events:none;user-select:none}
.head h2{position:relative;font-size:clamp(30px,5.4vw,52px)}
.head .lead{position:relative}
.lead{font-size:17px;color:var(--ink-2);max-width:60ch}
.eyebrow{position:relative;font:500 12px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}

/* ---- 판 ---- */
.sheet{position:relative;background:linear-gradient(180deg,var(--glass-2),var(--glass));border-radius:22px;padding:24px;box-shadow:inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* 민지의 노트: 손글씨 대신 인용 */
.minji{position:relative;padding:18px 22px 18px 24px;border-radius:4px 20px 20px 4px;background:linear-gradient(90deg,rgba(245,176,74,.10),rgba(245,176,74,.02));box-shadow:inset 3px 0 0 var(--gold);display:flex;flex-direction:column;gap:10px}
.minji::before{content:"민지의 노트";font:500 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--gold)}
.hand{font-size:17px;line-height:1.6;color:var(--ink);font-weight:500}
.hand::before{content:"“";color:var(--gold)} .hand::after{content:"”";color:var(--gold)}
.minji .spread .hand::before,.minji .spread .hand::after{content:none}
.scribble{display:flex;flex-wrap:wrap;gap:6px}
.scribble span{padding:4px 10px;border-radius:8px;background:var(--glass-2);font-size:13px;color:var(--ink-2)}

/* 버튼 */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:14.5px;
  background:var(--ink);color:var(--bg);transition:transform .35s var(--ux-spring),background .25s,box-shadow .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.btn.hot{background:var(--ember);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:0 12px;height:38px;font-weight:500}
.btn.armed{background:#FF6B6B;color:var(--bg);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px}
.keys{font:500 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--ink-3)}
.keys kbd{display:inline-block;padding:3px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--hair-2);font:inherit;color:var(--ink-2)}
@media (hover:none){.keys{display:none}}

/* 입력 */
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}
.inp{font:inherit;font-size:15.5px;color:var(--ink);background:rgba(255,255,255,.04);border:0;border-radius:14px;padding:13px 15px;width:100%;min-width:0;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .3s var(--ux-ease),background .3s}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--ember),0 0 0 4px rgba(255,106,61,.14)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.6}
/* 왜? 사다리: 한 줄로 시작해서 글이 길면 늘어납니다 (지원하지 않는 브라우저는 두 줄) */
textarea.inp.rung-in{min-height:0;resize:none;field-sizing:content}
@supports not (field-sizing:content){textarea.inp.rung-in{min-height:5.2em}}

details.why{border-top:1px solid var(--hair);padding-top:14px}
details.why summary{cursor:pointer;font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--ink-3);list-style:none}
details.why summary::before{content:"+ "}
details.why[open] summary::before{content:"– "}
details.why p{margin-top:10px;font-size:14px;color:var(--ink-2);max-width:64ch}
details.more summary{cursor:pointer;font-weight:700;color:var(--ink);list-style:none}
details.more summary::after{content:" ↓";color:var(--gold)}

/* ---- 미션 0: 첫 화면 ---- */
.hero{position:relative;width:100vw;margin-inline:calc(50% - 50vw);min-height:min(92svh,860px);display:flex;flex-direction:column;justify-content:space-between;padding:22px calc(50vw - 50%) 26px;overflow:hidden;isolation:isolate}
@media (min-width:1000px){.hero{width:calc(100vw - 64px);margin-left:calc(50% - 50vw + 22px);margin-right:0;padding-left:calc(50vw - 50% - 22px);padding-right:calc(50vw - 50% - 42px)}}
.hero .u352{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 30% 40%,transparent 30%,rgba(10,9,8,.55) 70%,var(--bg) 100%),linear-gradient(180deg,transparent 60%,var(--bg))}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero h1{white-space:nowrap;font:900 clamp(40px,calc((min(100vw,1060px) - 40px) / 6.3),168px)/.82 var(--f-display);font-stretch:125%;letter-spacing:-.05em;margin:auto 0 0;padding-top:12vh;text-shadow:0 10px 60px rgba(0,0,0,.4)}
.hero h1 span{display:block;font:900 clamp(26px,4.6vw,56px)/1.15 var(--f-body);letter-spacing:-.045em;margin-top:18px}
.hero h1 span em{font-style:normal;color:var(--ember)}
.hero-low{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:24px;align-items:end;margin-top:30px}
@media (max-width:760px){.hero-low{grid-template-columns:minmax(0,1fr)}}
@media (min-width:1000px){.hero h1{font-size:clamp(40px,calc((min(100vw - 84px,976px) - 30px) / 6.3),168px)}}
.hero h1 span{white-space:normal}
@media (max-width:600px){.hero-top .label:last-child{display:none}}
.hero-side{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--hair-2)}
.hero-side b{font:700 13px/1 var(--f-mono);letter-spacing:.12em}
.hero-side p{font-size:14px;color:var(--ink-2)}
.hint{display:flex;align-items:center;gap:10px;font:500 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--ink-3)}
.hint i{width:28px;height:1px;background:var(--ink-3)}

.chapter{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.chapter{grid-template-columns:minmax(0,1fr)}}
.chapter h2{font-size:clamp(28px,4.4vw,44px)}
.stack{display:flex;flex-direction:column;gap:14px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hair-2)}
@media (max-width:700px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats4 div{padding:18px 14px 6px 0;display:flex;flex-direction:column;gap:6px}
.stats4 b{font:900 clamp(40px,6vw,64px)/.9 var(--f-display);font-stretch:112%;letter-spacing:-.04em}
.stats4 span{font-size:13px;color:var(--ink-2)}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px 0}

/* ---- #029 색 태그 입력 (메모 꺼내기) ---- */
.u029{position:relative;width:100%}
.u029-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.u029-head b{font-size:16px;font-weight:720;letter-spacing:-.02em}
.u029-n{font-size:13px;font-weight:700;color:var(--ux-ink-3);font-variant-numeric:tabular-nums;transition:color .3s}
.u029-n.full{color:var(--ux-warn)}
.u029-field{display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;min-height:142px;padding:12px;border-radius:20px;background:var(--ux-surface);box-shadow:0 0 0 1.5px var(--ux-line-2);cursor:text;transition:box-shadow .3s var(--ux-ease)}
.u029-field:focus-within{box-shadow:0 0 0 2px var(--ux-accent),0 0 0 6px var(--ux-accent-soft)}
.u029-field.shake{animation:u029-shake .42s var(--ux-ease)}
@keyframes u029-shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}}
.u029-tag{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:4px 6px 4px 12px;border-radius:11px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ux-ink));font-size:14px;font-weight:700;
  animation:u029-pop .45s var(--ux-spring);transition:transform .3s var(--ux-ease),opacity .3s var(--ux-ease),box-shadow .2s}
@keyframes u029-pop{from{transform:scale(.4);opacity:0}}
.u029-tag.out{transform:scale(.4);opacity:0}
.u029-tag.armed{box-shadow:0 0 0 2px var(--c);animation:u029-arm .3s var(--ux-ease)}
@keyframes u029-arm{50%{transform:scale(1.08)}}
.u029-x{width:22px;height:22px;flex:none;border:0;padding:0;border-radius:7px;background:none;color:inherit;display:grid;place-items:center;opacity:.7}
.u029-x:hover{opacity:1;background:color-mix(in srgb,currentColor 15%,transparent)}
.u029-x:focus-visible{outline:2px solid currentColor;outline-offset:1px}
.u029-x svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.u029-in{flex:1;min-width:150px;height:34px;border:0;outline:0;background:none;font-size:14.5px;color:var(--ux-ink)}
.u029-in::placeholder{color:var(--ux-ink-3)}
.u029-msg{height:18px;margin:8px 4px 10px;font-size:12.5px;color:var(--ux-ink-3);transition:color .3s}

/* ---- 미션 6 ---- */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.flow > *{position:relative}

/* ---- 미션 7·8 ---- */
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:st}

.record{white-space:pre-wrap;font-size:14px;line-height:1.75;padding:20px;border-radius:20px;background:var(--ux-surface-2);max-height:480px;overflow-y:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- #002 자석 화살표 버튼 (다음 미션) ---- */
.u002{--bg:#F3EEE8;--fg:#0A0908;--blob:linear-gradient(135deg,#FF6A3D,#F5B04A 60%,#8FCB9B);position:relative;display:grid;place-items:center;padding:14px 0}
.u002-mag{transition:translate .9s var(--ux-spring)}
.u002-btn{position:relative;display:flex;align-items:center;gap:18px;height:76px;padding:0 10px 0 32px;border:0;border-radius:999px;background:var(--bg);color:var(--fg);overflow:hidden;isolation:isolate;
  box-shadow:0 24px 40px -24px rgba(255,106,61,.5),0 0 0 1px color-mix(in srgb,var(--fg) 8%,transparent);transition:transform .6s var(--ux-spring),box-shadow .6s var(--ux-ease)}
.u002-btn:hover{box-shadow:0 30px 52px -22px rgba(255,106,61,.7),0 0 0 1px transparent}

.u002-btn:hover .u002-fill,.u002-btn:focus-visible .u002-fill{clip-path:circle(160% at calc(100% - 38px) 50%)}
.u002-txt{position:relative;overflow:hidden;padding:5px 0;font-size:19px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;transition:translate .7s var(--ux-spring),color .5s var(--ux-ease)}
.u002-btn:hover .u002-txt{color:#0A0908}
.u002-txt span{display:block;transition:transform .6s var(--ux-spring),opacity .35s var(--ux-ease)}
.u002-txt span+span{position:absolute;left:0;top:5px;transform:translateY(130%);opacity:0}
.u002[data-state="go"] .u002-txt span:first-child{transform:translateY(-130%);opacity:0}
.u002[data-state="go"] .u002-txt span+span{transform:none;opacity:1}
.u002-orb{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#0A0908;overflow:hidden;flex:none;transition:translate .7s var(--ux-spring)}

@keyframes u002-out{to{transform:translateX(46px)}}
@keyframes u002-in{to{transform:none}}
.u002-glow{position:absolute;left:50%;top:50%;width:min(300px,100%);height:110px;transform:translate(-50%,-50%);border-radius:50%;background:var(--blob);filter:blur(36px);opacity:0;z-index:-1;transition:opacity .7s var(--ux-ease);pointer-events:none}
.u002:hover .u002-glow{opacity:.35}
@media (max-width:420px){.u002-btn{height:64px;padding-left:22px;gap:12px}.u002-txt{font-size:16px}.u002-orb{width:46px;height:46px}}

<script type="text/plain" id="gas-code">/**
 * 아침 지원 브리핑 (민지의 첫 자동화)
 * 시트 '지원현황'을 읽어서 매일 아침 이런 메일을 보냅니다.
 *  1) 오늘~3일 안에 있는 일정 (날짜순)
 *  2) 날짜를 모르는 일정 → 오늘 확인할 것
 *  3) 날짜가 지났는데 완료 표시가 없는 것
 * 열 순서: 회사명 | 단계 | 다음 일정 | 날짜 | 할 일 | 상태
 */
const SHEET_NAME = '지원현황';
const DAYS_AHEAD = 3;

function morningBriefing() {
  const sheet = SpreadsheetApp.getActive().getSheetByName(SHEET_NAME);
  const rows = sheet.getDataRange().getValues().slice(1); // 첫 줄(제목) 제외
  // 날짜는 시트의 시간대로 셉니다 (스크립트 시간대가 달라도 하루씩 어긋나지 않게)
  const tz = SpreadsheetApp.getActive().getSpreadsheetTimeZone();
  const day = d => { const [y, m, dd] = Utilities.formatDate(d, tz, 'yyyy-MM-dd').split('-').map(Number); return Date.UTC(y, m - 1, dd) / 86400000; };
  const today = day(new Date());

  const soon = [], unknown = [], overdue = [];
  rows.forEach(([company, stage, next, date, todo, status]) => {
    if (!company || status === '완료') return;
    const item = { company, stage, next, todo };
    if (date === '' || date === null) { unknown.push(item); return; }
    const d = date instanceof Date ? date : new Date(String(date));
    if (isNaN(d)) { unknown.push(item); return; }
    item.left = day(d) - today;
    if (item.left < 0) overdue.push(item);
    else if (item.left <= DAYS_AHEAD) soon.push(item);
  });

  if (!soon.length && !unknown.length && !overdue.length) return; // 알릴 게 없으면 보내지 않음
  soon.sort((a, b) => a.left - b.left);

  const line = s => `· ${s.company} [${s.stage}] ${s.next}${s.todo ? ' → ' + s.todo : ''}`;
  const parts = [];
  if (soon.length) parts.push('■ 3일 안에 있는 일정\n' +
    soon.map(s => `${s.left === 0 ? '오늘' : 'D-' + s.left} ${line(s)}`).join('\n'));
  if (unknown.length) parts.push('■ 날짜를 모름 → 오늘 확인할 것\n' + unknown.map(line).join('\n'));
  if (overdue.length) parts.push('■ 날짜가 지났는데 완료 표시가 없음\n' + overdue.map(line).join('\n'));

  MailApp.sendEmail(
    Session.getEffectiveUser().getEmail(),
    `[오늘의 지원 브리핑] 임박 ${soon.length} · 확인 필요 ${unknown.length}`,
    parts.join('\n\n')
  );
}

/** 한 번만 실행하면 매일 아침 8시(시트 시간대 기준)에 morningBriefing이 자동으로 돌아갑니다. */
function createDailyTrigger() {
  ScriptApp.getProjectTriggers()
    .filter(t => t.getHandlerFunction() === 'morningBriefing')
    .forEach(t => ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger('morningBriefing').timeBased().everyDays(1).atHour(8)
    .inTimezone(SpreadsheetApp.getActive().getSpreadsheetTimeZone()).create();
}
</script>

<script type="text/plain" id="n8n-brief">// 시트의 각 줄을 '3일 안 / 날짜 모름 / 지남'으로 나눠 메일 본문 하나로 묶습니다.
const DAYS_AHEAD = 3;
// 날짜는 서울 기준으로 셉니다. n8n 서버 시간대가 달라도 하루씩 어긋나지 않게 '연-월-일'만 비교해요.
const day = v => { const m = String(v ?? '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? Date.UTC(+m[1], m[2] - 1, +m[3]) / 86400000 : NaN; };
const today = day($now.setZone('Asia/Seoul').toFormat('yyyy-MM-dd'));

const soon = [], unknown = [], overdue = [];
for (const { json: r } of $input.all()) {
  if (!r['회사명'] || r['상태'] === '완료') continue;
  const item = { company: r['회사명'], stage: r['단계'], next: r['다음 일정'], todo: r['할 일'] };
  const d = day(r['날짜']);
  if (isNaN(d)) { unknown.push(item); continue; }
  item.left = d - today;
  if (item.left < 0) overdue.push(item);
  else if (item.left <= DAYS_AHEAD) soon.push(item);
}
if (!soon.length && !unknown.length && !overdue.length) return [];
soon.sort((a, b) => a.left - b.left);

const line = s => `· ${s.company} [${s.stage}] ${s.next}${s.todo ? ' → ' + s.todo : ''}`;
const parts = [];
if (soon.length) parts.push('■ 3일 안에 있는 일정\n' + soon.map(s => `${s.left === 0 ? '오늘' : 'D-' + s.left} ${line(s)}`).join('\n'));
if (unknown.length) parts.push('■ 날짜를 모름 → 오늘 확인할 것\n' + unknown.map(line).join('\n'));
if (overdue.length) parts.push('■ 날짜가 지났는데 완료 표시가 없음\n' + overdue.map(line).join('\n'));

return [{ json: { soon: soon.length, unknown: unknown.length, body: parts.join('\n\n') } }];
</script>

<script type="text/plain" id="n8n-parse">// AI 답변에서 JSON만 꺼내 시트 한 줄로 바꿉니다. 채용 메일이 아니면 버립니다.
const out = [];
for (const { json } of $input.all()) {
  const m = String(json.text || '').match(/\{[\s\S]*\}/);
  if (!m) continue;
  let r;
  try { r = JSON.parse(m[0]); } catch { continue; }
  if (!r['회사명']) continue;
  out.push({ json: {
    '회사명': r['회사명'], '단계': r['단계'] || '', '다음 일정': r['다음 일정'] || '',
    '날짜': r['날짜'] || '', '할 일': r['할 일'] || '', '상태': '진행중',
  } });
}
return out;
</script>

/* shaula.kr/siltarae 처럼 다른 경로 아래에서 열려도 같은 배포의 /api/ai 로 가도록, 지금 페이지 경로를 앞에 붙인다. */
const AI_URL = location.pathname.replace(/\/(index\.html)?$/, '') + '/api/ai';
const aiErr = (code, text = '') => Object.assign(new Error(code), {code, text});
async function webSample(input, {signal, onText, kind = 'coach'} = {}){
  const messages = typeof input === 'string' ? [{role: 'user', content: input}] : input;
  let res = null;
  if (location.protocol.startsWith('http')){
    try { res = await fetch(AI_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({kind, messages}), signal}); }
    catch (e){ if (signal?.aborted) throw aiErr('cancelled'); res = null; }
  }
  if (res?.status === 429) throw aiErr('rate_limited');
  if (!res || !res.ok || !res.body) return demoSample(kind, {signal, onText});
  const reader = res.body.getReader(), dec = new TextDecoder();
  let text = '';
  try {
    for (;;){ const {done, value} = await reader.read(); if (done) break; text += dec.decode(value, {stream: true}); onText?.({text}); }
  } catch (e){ throw aiErr(signal?.aborted ? 'cancelled' : 'error', text); }
  if (!text.trim()) throw aiErr('error');
  return {text};
}
async function demoSample(kind, {signal, onText}){
  toast('체험판이라 미리 준비한 예시 답변을 보여 드려요.');
  const full = DEMO[kind]?.() || DEMO.coach();
  let text = '';
  for (const w of full.split(/(\s+)/)){
    if (signal?.aborted) throw aiErr('cancelled', text);
    text += w; onText?.({text}); if (w.trim()) await new Promise(r => setTimeout(r, reduced() ? 0 : 35));
  }
  return {text};
}
const clip = (t, n = 18) => { t = String(t || '').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const DEMO = {

    const ns = S.notes.map(n => n.text).filter(Boolean), a = clip(ns[0]), b = clip(ns[1] || ns[0]), c = clip(ns[ns.length - 1]);

function countUp(scope){

    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 500); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };

function buildRail(){
  $('#side').innerHTML = `<button class="mark" data-act="go" data-to="0" aria-label="처음 화면으로">실</button>
    <ol>${M.map((m, i) => `<li><button data-act="go" data-to="${i}" aria-label="${pad2(i)} ${esc(m.name)}"><span>${pad2(i)}</span><span class="nm">${esc(m.name)}</span></button></li>`).join('')}</ol>
    <div class="count"><b id="side-n">00</b>/ ${pad2(M.length - 1)}<br><button data-act="reset" style="margin-top:8px">RESET</button></div>`;
  $('#topbar').innerHTML = `<div class="in"><span class="now" id="top-now"></span><button class="menu-btn" data-act="menu" aria-expanded="false" aria-controls="menu">MENU</button></div><div class="progress"><i id="top-prog"></i></div>`;
  $('#menu').innerHTML = `<div class="spread"><span class="label">미션 목록</span><button class="btn quiet" data-act="menu-close">닫기</button></div>
    <ol>${M.map((m, i) => `<li><button data-act="go" data-to="${i}"><span>${pad2(i)}</span>${esc(m.name)}</button></li>`).join('')}</ol>
    <div class="row" style="margin-top:14px"><button class="btn quiet" data-act="reset">처음부터 다시 하기</button></div>`;
}
function updateRail(){
  $('#side-n').textContent = pad2(S.cur);
  $('#top-now').innerHTML = `<b>${pad2(S.cur)}</b> / ${pad2(M.length - 1)} · ${esc(M[S.cur].name)}`;
  $('#top-prog').style.width = `${S.cur / (M.length - 1) * 100}%`;
  document.querySelectorAll('#side ol button, #menu ol button').forEach(b => {
    const i = +b.dataset.to; b.classList.toggle('done', !!S.done[i] && i !== S.cur);
    if (i === S.cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function openMenu(open){
  $('#menu').classList.toggle('open', open); $('#scrim').classList.toggle('open', open);
  $('.menu-btn')?.setAttribute('aria-expanded', String(open));
  if (open) $('#menu button[aria-current]')?.focus();
}
function goNext(){ if (S.cur < M.length - 1){ S.done[S.cur] = true; S.cur++; render(true); } }
function goPrev(){ if (S.cur > 0){ S.cur--; render(true); } }
function render(scroll){
  if (!M[S.cur]) S.cur = 0;
  updateRail();
  $('#main').innerHTML = M[S.cur].render();
  mountAll($('#main'));
  MOUNT[S.cur]?.();
  const c = $('#chat-log'); if (c) c.scrollTop = c.scrollHeight;
  if (S.cur === 9){
    if (window.claude?.use) window.claude.use('downloads').then(dl => { if (dl && $('#dl-btn')) $('#dl-btn').hidden = false; }).catch(() => {});
    else if ($('#dl-btn')) $('#dl-btn').hidden = false;
  }
  if (scroll) window.scrollTo({top: 0, behavior: reduced() ? 'auto' : 'smooth'});
  save();
}

/* ================= 이벤트 ================= */
let armed = null;
const disarmBtn = () => { if (armed){ armed.classList.remove('armed'); armed.textContent = armed.dataset.label; armed = null; } };
function addCo(){
  const box = $('#co-in'), v = box.value.trim(); if (!v || v === COMMON || S.companies.includes(v)) { box.value = ''; return; }
  S.companies.push(v); render(); $('#co-in')?.focus();
}
function m3go(i){
  S.m3i = Math.max(0, Math.min(S.notes.length - 1, i)); save();
  $('#deck').innerHTML = deckHTML();
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (armed && armed !== el) disarmBtn();
  switch (act){
    case 'go': openMenu(false); S.cur = Number(el.dataset.to); render(true); break;
    case 'next': goNext(); break;
    case 'menu': openMenu(!$('#menu').classList.contains('open')); break;
    case 'menu-close': openMenu(false); break;
    case 'sug': sendChat(el.textContent); break;
    case 'fill': {
      const step = Number(el.dataset.step);
      if (wouldOverwrite(step) && armed !== el){ el.dataset.label = el.textContent; el.textContent = '한 번 더 누르면 민지 예시로 바뀌어요'; el.classList.add('armed'); armed = el; break; }
      armed = null; fill(step); break; }
    case 'reset':
      if (armed !== el){ el.dataset.label = el.textContent; el.textContent = '한 번 더 누르면 모두 지워져요'; el.classList.add('armed'); armed = el; break; }
      armed = null; S = blank(); picked = null; render(true); break;
    case 'addco': addCo(); break;
    case 'delco': S.companies = S.companies.filter(c => c !== el.dataset.co); S.notes.forEach(n => { if (n.co === el.dataset.co) n.co = ''; }); render(); break;
    case 'setco': {
      const n = picked && noteOf(picked); if (!n) break;
      n.co = n.co === el.dataset.co ? '' : el.dataset.co; save();
      el.parentElement.querySelectorAll('.u019-chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.co === n.co)));
      const card = document.querySelector(`.u255-cd[data-id="${n.id}"]`); if (card) paintTag(card, n);
      if ($('#matrix')) $('#matrix').innerHTML = matrixHTML();
      break; }
    case 'm3go': m3go(+el.dataset.i); break;
    case 'where': {
      const n = S.notes[Math.min(S.m3i || 0, S.notes.length - 1)], v = el.dataset.v;
      n.where = (n.where || []).includes(v) ? n.where.filter(x => x !== v) : [...(n.where || []), v]; save();
      el.setAttribute('aria-pressed', String(n.where.includes(v)));
      const dots = el.closest('.u019').querySelectorAll('.u019-dots i'); dots.forEach((d, k) => d.classList.toggle('on', k < n.where.length));
      el.closest('.u019').querySelector('.u019-cnt > span:last-child').textContent = `${n.where.length}곳`;
      refreshKnot(); break; }
    case 'sure': {
      const i = Math.min(S.m3i || 0, S.notes.length - 1), n = S.notes[i];
      n.sure = n.sure === el.dataset.v ? '' : el.dataset.v; save();
      el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === n.sure)));
      document.querySelectorAll('.bead')[i]?.setAttribute('class', `bead ${n.sure} cur`);
      refreshKnot();
      if (n.sure && i < S.notes.length - 1) setTimeout(() => { if (S.cur === 3 && (S.m3i || 0) === i) m3go(i + 1); }, reduced() ? 0 : 450);
      break; }
    case 'type': S.why.type = S.why.type === el.dataset.v ? '' : el.dataset.v; save();
      document.querySelectorAll('.type').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.why.type)));
      $('#dir').innerHTML = S.why.type ? `<div class="dir"><b>${S.why.type} 문제라면:</b> ${esc(TYPES[S.why.type].dir)}</div>` : '';
      break;
    case 'hint': runHint(el); break;
    case 'send': sendChat(); break;
    case 'stop': ctl?.abort(); break;
    case 'chatreset': S.chat = []; render(); break;
    case 'gen': genCode(el); break;
    case 'download': {
      try {
        if (window.claude?.use){ const dl = await window.claude.use('downloads'); await dl.save({filename: '문제해결-기록.md', data: recordText()}); }
        else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([recordText()], {type: 'text/markdown;charset=utf-8'}));
          a.download = 'siltarae-record.md'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
        toast('저장했어요.');
      }
      catch { toast('저장하지 못했어요. 복사 버튼을 써 주세요.'); }
      break; }
  }
});
$('#main').addEventListener('keydown', e => {
  if (e.isComposing || e.key !== 'Enter') return;
  if (e.target.id === 'co-in'){ e.preventDefault(); addCo(); }
  else if (e.target.id === 'chat-in' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#menu').classList.contains('open')) { openMenu(false); $('.menu-btn')?.focus(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.isComposing) return;
  if (e.target.closest?.('input,textarea,select,[contenteditable],.u255-cd,.u039-tab')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
});

buildRail();
render();
})();

</script>
